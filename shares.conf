# The network shares every script reads from or writes to, by role.
#
# This file is sourced by lib/shares.sh. A host that differs -- another
# server, user, transport or mount point -- overrides any of these in a
# git-ignored shares.local.conf beside it, which is sourced afterwards. No
# password belongs in either: NFS needs none, and a host that uses SMB
# instead gets its credentials from the macOS Keychain.
#
# For each role and platform (darwin, linux):
#   SHARE_<role>_<platform>_mount    where the share is expected to be mounted
#   SHARE_<role>_<platform>_source   what should be mounted there, as the
#                                    platform's mount table spells it
#   SHARE_<role>_<platform>_fstype   the filesystem type the mount table shows
#   SHARE_<role>_darwin_options      mount_nfs options, used by mac-nfs-mount.sh
#
# The mount point is overridden per run by DD_LIBRARY and DD_DECODES.
#
# library  The capture library. Read-only: nothing ever writes to it.
# decodes  Everything the scripts produce, including their scratch space.

# macOS uses NFS, as Linux does, at mount points of its own. Any SMB mounts
# of the same shares under /Volumes are ignored, since a share is identified
# by its mount source. An ordinary user cannot make an NFS mount on macOS, so
# these are mounted by "sudo ./mac-nfs-mount.sh" (once after each boot).
#
# resvport: Synology accepts NFS only from a privileged port by default, and
# root can use one. nfc: file names are compared in the composed Unicode form
# the NAS stores, rather than macOS's decomposed one.
SHARE_library_darwin_mount=/Users/Shared/Domesday86/Domesday86_Library
SHARE_library_darwin_source=10.0.1.4:/volume1/Domesday86_Library
SHARE_library_darwin_fstype=nfs
SHARE_library_darwin_options=ro,vers=3,resvport,nfc,hard,intr

SHARE_decodes_darwin_mount=/Users/Shared/Domesday86/Domesday86_Decodes
SHARE_decodes_darwin_source=10.0.1.4:/volume1/Domesday86_Decodes
SHARE_decodes_darwin_fstype=nfs
SHARE_decodes_darwin_options=rw,vers=3,resvport,nfc,hard,intr

# The SFTP upload area. No script reads it; it is mounted (read-only) beside
# the others so that anything in the library that links into it resolves.
SHARE_sftp_darwin_mount=/Users/Shared/Domesday86/Domesday86_SFTP
SHARE_sftp_darwin_source=10.0.1.4:/volume1/Domesday86_SFTP
SHARE_sftp_darwin_fstype=nfs
SHARE_sftp_darwin_options=ro,vers=3,resvport,nfc,hard,intr

SHARE_library_linux_mount=/home/sdi/raid/Domesday86_Library
SHARE_library_linux_source=10.0.1.4:/volume1/Domesday86_Library
SHARE_library_linux_fstype=nfs

SHARE_decodes_linux_mount=/home/sdi/raid/Domesday86_Decodes
SHARE_decodes_linux_source=10.0.1.4:/volume1/Domesday86_Decodes
SHARE_decodes_linux_fstype=nfs

# Seconds a share has to answer a stat and a directory listing before it is
# taken to be hung.
SHARE_TIMEOUT=10
