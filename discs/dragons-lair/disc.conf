# shellcheck shell=bash
#
# Dragon's Lair: what build-pack.sh needs to know about the disc beyond its
# set table, which it reads from decode-dragons-lair.sh so that there is still
# one list of the captures it is built from.

# The script whose SETS table lists the captures.
DISC_SCRIPT=decode-dragons-lair.sh

# The disc's name as the pack report gives it. Not stamped.
DISC_TITLE="Dragon's Lair"

# Where the disc's outputs go, under $DD_DECODES/decode-script/.
DISC_OUT=dragons-lair

# The stem the pack is named by: <stem>.mkv. With no EFM there is no
# <stem>.dat or <stem>.dat.bsm.
STEM=dragons_lair

# The video system: NTSC, where the Domesday sides are PAL. It sets what the
# video stage expects of the mkv (720x484 at 30000/1001) and of its disc
# metadata. Every project in discs/dragons-lair/ is NTSC to match.
DISC_SYSTEM=NTSC

# The disc carries no EFM: its sound is analogue only (the frame-sync probes
# under "Decoding the Dragon's Lair disc" in the README), and
# decode-dragons-lair.sh decodes it with --noEFM. So the set stage measures
# quality alone, selection.yaml has no vfs stack, there is no vfs stage, and
# the pack is <stem>.mkv alone.
DISC_EFM=no

# The video sink's decoder: ntsc3d, the adaptive 3D comb, on every frame. The
# disc is animation, moving from frame to frame, which is what the 3D comb is
# for.
VIDEO_DECODER=ntsc3d
VIDEO_DECODER_SCHEDULE=

# The ld-decode settings every set is decoded with. They are part of each
# decode's stamp, so changing one marks every decode stale.
DECODE_LEAD_IN=1
DECODE_FRAMES=all

# How build-pack.sh runs the decodes: two at a time, four ld-decode workers
# each, the measured best (docs/performance.md). Speed only; not stamped.
DECODE_JOBS=2
DECODE_THREADS=4

# How build-pack.sh runs the set stage: SET_JOBS sets at a time. Reading the
# decode over the share is what bounds it, not the CPU. Speed only; not
# stamped.
SET_JOBS=3

# What the disc metadata must say (the video stage's checks): its format and
# side, and the programme's pictures, every one of which must resolve to one
# frame of the mkv. The disc is CAV, pictures 1-31805 (DS1 runs from #1 to
# #31805 over 39,756 frames: in 3:2 pulldown five frames carry four
# pictures, and the fifth, which has no picture number, is unnumbered).
DISC_FORMAT=CAV
DISC_SIDE=1
DISC_PICTURES=1-31805

# The hand-built stack the video stage's result is compared with, relative
# to the decodes share. Read only; empty for none. Dragon's Lair has none.
VIDEO_BASELINE=
