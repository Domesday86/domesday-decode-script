# shellcheck shell=bash
#
# Volcanoes: what build-pack.sh needs to know about the disc beyond its set
# table, which it reads from decode-volcanoes.sh so that there is still one
# list of captures.

# The script whose SETS table lists the captures.
DISC_SCRIPT=decode-volcanoes.sh

# Where the disc's outputs go, under $DD_DECODES/decode-script/.
DISC_OUT=volcanoes

# The stem vp415e loads the side by: <stem>.mkv, <stem>.dat, <stem>.dat.bsm.
STEM=volcanoes_stack

# The video sink's decoder. Volcanoes is mostly stills, so transform2d (for
# now); motion discs use transform3d.
VIDEO_DECODER=transform2d

# The ld-decode settings every set is decoded with. They are part of each
# decode's stamp, so changing one marks every decode stale.
DECODE_LEAD_IN=1
DECODE_FRAMES=all

# How build-pack.sh runs the decodes: two at a time, four ld-decode workers
# each, the measured best (docs/performance.md). Speed only; not stamped.
DECODE_JOBS=2
DECODE_THREADS=4

# How build-pack.sh runs the set stage: SET_JOBS sets at a time. Reading the
# decode over the share is what bounds it, not the CPU. Speed only; not
# stamped.
SET_JOBS=2
