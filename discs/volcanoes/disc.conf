# shellcheck shell=bash
#
# Volcanoes: what build-pack.sh needs to know about the disc beyond its set
# table, which it reads from decode-volcanoes.sh so that there is still one
# list of captures.

# The script whose SETS table lists the captures.
DISC_SCRIPT=decode-volcanoes.sh

# The disc's name as the pack report gives it. Not stamped.
DISC_TITLE=Volcanoes

# Where the disc's outputs go, under $DD_DECODES/decode-script/.
DISC_OUT=volcanoes

# The stem vp415e loads the side by: <stem>.mkv, <stem>.dat, <stem>.dat.bsm.
STEM=volcanoes_stack

# The video sink's decoder, by picture number (decoder_type multiple, with this
# schedule): transform3d for pictures 1-46750 and 47601-49200, the motion
# sequences, and palstill for 46751-47600 and 49201-54000, the stills: palstill
# is decode-orc's PAL Still decoder, made for single-frame stills. The ranges
# are the side's known content, not the stacker's held-picture guess. The
# schedule counts the sink's frames 0-based, and the address map puts picture p
# on frame p (one run, frame 0 and 54001 the lead-in and lead-out, which the
# default palstill decodes).
VIDEO_DECODER=multiple
VIDEO_DECODER_SCHEDULE="palstill, 1-46750:transform3d, 46751-47600:palstill, 47601-49200:transform3d, 49201-54000:palstill"

# The ld-decode settings every set is decoded with. They are part of each
# decode's stamp, so changing one marks every decode stale.
DECODE_LEAD_IN=1
DECODE_FRAMES=all

# How build-pack.sh runs the decodes: two at a time, four ld-decode workers
# each, the measured best (docs/performance.md). Speed only; not stamped.
DECODE_JOBS=2
DECODE_THREADS=4

# How build-pack.sh runs the set stage: SET_JOBS sets at a time. Reading the
# decode over the share is what bounds it, not the CPU. Over the 10G link the
# share gives one reader about 300 MB/s and three about 380 MB/s together, so
# three sets at a time come closest to that. Speed only; not stamped.
SET_JOBS=3

# What the side's disc metadata must say (the video stage's checks): its
# format and side, and the programme's pictures, every one of which must
# resolve to one frame of the mkv.
DISC_FORMAT=CAV
DISC_SIDE=1
DISC_PICTURES=1-54000

# The hand-built stack the video stage's result is compared with, relative
# to the decodes share. Read only; empty for none.
VIDEO_BASELINE=vp415e_projects/Volcanoes_output/volcanoes_stack.mkv

# The hand-built VFS image the vfs stage's result is compared with (its .bsm
# beside it), relative to the decodes share. Read only; empty for none.
VFS_BASELINE=vp415e_projects/Volcanoes_output/volcanoes_stack.dat
