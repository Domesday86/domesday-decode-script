# Volcanoes: which sets go into the video and the VFS stacks, decided from
# the compare stage's report (orc-<rev>/compare/report.txt) as described in
# docs/emulator-pack-plan.md, phase 4. The video lists its sets the
# suggested reference first (it sets the stacker's sample grid), then by
# what each adds; the VFS lists its sets best first. Every mapped set a stack
# leaves out goes under dropped, with a reason.
#
# The evidence (orc-31d22e6, 2026-10-24): all five sets are one pressing on
# every count -- Source Alignment finds one stamper group, every set reads the same
# disc metadata (CAV side 1, user code 1986, CX off, Amendment 2 present),
# and every pair of EFM images holds the same bytes wherever both recovered
# a sector. None is soft at 5-6 MHz.

pressing: A

video:
  # By what each adds, the predicted stack σ without it, from Source
  # Alignment's capture comparison (orc-1a152d6, 2026-10-27), and its share of
  # the weight: DS1 5.05 (24%), DS2 5.03 (23%), DS3 4.96 (21%), DS4 4.87 (18%),
  # DS5 4.75 (14%); 4.41 with all five. Every set adds, so none is left out.
  # DS1 is first: it is the compare report's suggested reference (15 padding
  # frames, adds the most), and sample_align lines the others up on its sample
  # grid. The next choice is DS4 (16 padding frames, adds 4.87).
  sets: [DS1, DS2, DS3, DS4, DS5]
  dropped: []

vfs:
  # By data loss after C2: 0.008%, 0.024%, 0.032%, 0.056%, 1.74%. DS3 is the
  # most damaged, but it agrees with the others wherever both recovered a
  # sector, so it still votes; last, since vfs-stacker breaks a split vote
  # towards its first input.
  sets: [DS1, DS2, DS4, DS5, DS3]
  dropped: []
