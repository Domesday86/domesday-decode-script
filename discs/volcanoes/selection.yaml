# Volcanoes: which sets go into the video and the VFS stacks, decided from
# the compare stage's report (orc-<rev>/compare/report.txt) as described in
# docs/emulator-pack-plan.md, phase 4. Each stack lists its sets best first;
# every mapped set it leaves out goes under dropped, with a reason.
#
# The evidence (orc-31d22e6, 2026-10-24): all five sets are one pressing on
# every count -- Source Alignment finds one group, every set reads the same
# disc metadata (CAV side 1, user code 1986, CX off, Amendment 2 present),
# and every pair of EFM images holds the same bytes wherever both recovered
# a sector. None is soft at 5-6 MHz.

pressing: A

video:
  # By noise sigma from Source Alignment's capture comparison: 8.6, 9.5,
  # 9.7, 11.0, 11.7. The Weighted stacker gives the noisier sets less weight
  # itself, so none is left out. DS1 is first: sample_align lines the others
  # up on its sample grid.
  sets: [DS1, DS3, DS2, DS4, DS5]
  dropped: []

vfs:
  # By data loss after C2: 0.008%, 0.024%, 0.032%, 0.056%, 1.74%. DS3 is the
  # most damaged, but it agrees with the others wherever both recovered a
  # sector, so it still votes; last, since vfs-stacker breaks a split vote
  # towards its first input.
  sets: [DS1, DS2, DS4, DS5, DS3]
  dropped: []
