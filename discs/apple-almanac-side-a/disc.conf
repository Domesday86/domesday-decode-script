# shellcheck shell=bash
#
# Apple Visual Almanac side A: what build-pack.sh needs to know about the
# side beyond its set table, which it reads from
# decode-apple-almanac-side-a.sh so that there is still one list of the
# captures it is built from.

# The script whose SETS table lists the captures.
DISC_SCRIPT=decode-apple-almanac-side-a.sh

# The side's name as the pack report gives it. Not stamped.
DISC_TITLE="Apple Visual Almanac side A"

# Where the side's outputs go, under $DD_DECODES/decode-script/.
DISC_OUT=apple-almanac-side-a

# The stem the pack is named by: <stem>.mkv. With no EFM there is no
# <stem>.dat or <stem>.dat.bsm.
STEM=apple_almanac_side_a

# The video system: NTSC, where the Domesday sides are PAL. It sets what the
# video stage expects of the mkv (720x484 at 30000/1001) and of its disc
# metadata. Every project in discs/apple-almanac-side-a/ is NTSC to match.
DISC_SYSTEM=NTSC

# The disc carries no EFM: its sound is analogue only (the frame-sync probes
# under "Decoding the Apple Visual Almanac disc" in the README), and
# decode-apple-almanac-side-a.sh decodes it with --noEFM. So the set stage
# measures quality alone, selection.yaml has no vfs stack, there is no vfs
# stage, and the pack is <stem>.mkv alone.
DISC_EFM=no

# The video sink's decoder: ntsc2d, with ntsc3d for the frames the Stacker
# finds held. The disc is stills, video and film, and which pictures are
# which is not yet known. A single-frame still has unrelated pictures either
# side, which the 3D comb would look into, so it gets only the held ones, as
# the City discs do with palstill, held:transform3d until their ranges are
# given.
VIDEO_DECODER=multiple
VIDEO_DECODER_SCHEDULE="ntsc2d, held:ntsc3d"

# The ld-decode settings every set is decoded with. They are part of each
# decode's stamp, so changing one marks every decode stale.
DECODE_LEAD_IN=1
DECODE_FRAMES=all

# How build-pack.sh runs the decodes: two at a time, four ld-decode workers
# each, the measured best (docs/performance.md). Speed only; not stamped.
DECODE_JOBS=2
DECODE_THREADS=4

# How build-pack.sh runs the set stage: SET_JOBS sets at a time. Reading the
# decode over the share is what bounds it, not the CPU. Speed only; not
# stamped.
SET_JOBS=3

# What the disc metadata must say (the video stage's checks): its format and
# side, and the programme's pictures, every one of which must resolve to one
# frame of the mkv. The Disc Mapper, run on DS1 (2026-11-05), reads CAV side
# 1, Amendment 2 present, user code 1315, CX off, sound mode bilingual, and
# sees the lead-in and the lead-out.
# The side is CAV, pictures 1-50683 (DS1 runs from #1 to #50683 over 54,000
# frames, 3,317 of them pulldown frames, which have no picture number and are
# left unnumbered).
DISC_FORMAT=CAV
DISC_SIDE=1
DISC_PICTURES=1-50683

# The hand-built stack the video stage's result is compared with, relative
# to the decodes share. Read only; empty for none. The Almanac has none.
VIDEO_BASELINE=
