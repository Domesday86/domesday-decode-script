# shellcheck shell=bash
#
# EcoDisc Side 2: what build-pack.sh needs to know about the side beyond its
# set table, which it reads from decode-ecodisc-side2.sh so that there is
# still one list of the captures it is built from.

# The script whose SETS table lists the captures.
DISC_SCRIPT=decode-ecodisc-side2.sh

# The side's name as the pack report gives it. Not stamped.
DISC_TITLE="EcoDisc Side 2"

# Where the side's outputs go, under $DD_DECODES/decode-script/.
DISC_OUT=ecodisc-side2

# The stem vp415e loads the side by: <stem>.mkv. With no EFM there is no
# <stem>.dat or <stem>.dat.bsm.
STEM=ecodisc_s2

# The side carries no EFM: the documentary has no data area (the frame-sync
# probes under "EFM" in the README), and decode-ecodisc-side2.sh decodes it
# with --noEFM. So the set stage measures quality alone, selection.yaml has
# no vfs stack, there is no vfs stage, and the pack is <stem>.mkv alone.
DISC_EFM=no

# The video sink's decoder: transform3d on every frame. The side is a TV
# programme, motion throughout, which is where the 3D filter separates best;
# the held schedule the still-frame sides use would give it transform2d
# nearly everywhere (docs/emulator-pack-plan.md, phase 5, has the per-side
# table this follows).
VIDEO_DECODER=transform3d
VIDEO_DECODER_SCHEDULE=

# The ld-decode settings every set is decoded with. They are part of each
# decode's stamp, so changing one marks every decode stale.
DECODE_LEAD_IN=1
DECODE_FRAMES=all

# How build-pack.sh runs the decodes: two at a time, four ld-decode workers
# each, the measured best (docs/performance.md). Speed only; not stamped.
DECODE_JOBS=2
DECODE_THREADS=4

# How build-pack.sh runs the set stage: SET_JOBS sets at a time. Reading the
# decode over the share is what bounds it, not the CPU. Over the 10G link the
# share gives one reader about 300 MB/s and three about 380 MB/s together, so
# three sets at a time come closest to that. Speed only; not stamped.
SET_JOBS=3

# What the side's disc metadata must say (the video stage's checks): its
# format and side, and the programme's pictures, every one of which must
# resolve to one frame of the mkv.
DISC_FORMAT=CAV
DISC_SIDE=2
DISC_PICTURES=1-35501

# The hand-built stack the video stage's result is compared with, relative
# to the decodes share. Read only; empty for none. EcoDisc has none.
VIDEO_BASELINE=
