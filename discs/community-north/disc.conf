# shellcheck shell=bash
#
# Domesday Community North: what build-pack.sh needs to know about the side
# beyond its set table, which it reads from decode-community-north.sh so that
# there is still one list of the captures it is built from.

# The script whose SETS table lists the captures.
DISC_SCRIPT=decode-community-north.sh

# The side's name as the pack report gives it. Not stamped.
DISC_TITLE="Domesday Community North"

# Where the side's outputs go, under $DD_DECODES/decode-script/.
DISC_OUT=community-north

# The stem vp415e loads the side by: <stem>.mkv, <stem>.dat, <stem>.dat.bsm.
STEM=dd_community_north

# The video sink's decoder, by picture number (decoder_type multiple, with
# this schedule): transform3d for pictures 1-3200 and 44381-54000, the
# motion sequences, and transform2d for 3201-44380, the stills. The ranges
# are the side's known content, not the stacker's held-picture guess. The
# schedule counts the sink's frames 0-based, and the address map puts
# picture p on frame p (one run, frame 0 and 54001 the lead-in and
# lead-out, which the default transform2d decodes).
VIDEO_DECODER=multiple
VIDEO_DECODER_SCHEDULE="transform2d, 1-3200:transform3d, 3201-44380:transform2d, 44381-54000:transform3d"

# The ld-decode settings every set is decoded with. They are part of each
# decode's stamp, so changing one marks every decode stale.
DECODE_LEAD_IN=1
DECODE_FRAMES=all

# How build-pack.sh runs the decodes: two at a time, four ld-decode workers
# each, the measured best (docs/performance.md). Speed only; not stamped.
DECODE_JOBS=2
DECODE_THREADS=4

# How build-pack.sh runs the set stage: SET_JOBS sets at a time. Reading the
# decode over the share is what bounds it, not the CPU. Over the 10G link the
# share gives one reader about 300 MB/s and three about 380 MB/s together, so
# three sets at a time come closest to that. Speed only; not stamped.
SET_JOBS=3

# What the side's disc metadata must say (the video stage's checks): its
# format and side, and the programme's pictures, every one of which must
# resolve to one frame of the mkv. The hand-built stack's metadata reads CAV
# side 2 (Community South is side 1), pictures 1-53999: it stops one picture
# short of the 54000 every capture's file name gives.
DISC_FORMAT=CAV
DISC_SIDE=2
DISC_PICTURES=1-54000

# The hand-built stack the video stage's result is compared with, relative
# to the decodes share. Read only; empty for none. It stacked DS2, DS4, DS6,
# DS8 and DS10. Its metadata reads user code 1067 and Amendment 2 present,
# with status agreement 0.79.
VIDEO_BASELINE=vp415e_projects/CommunityN_output/dd_comN_stack.mkv

# The hand-built VFS image the vfs stage's result is compared with (its .bsm
# beside it), relative to the decodes share. Read only; empty for none.
VFS_BASELINE=vp415e_projects/CommunityN_output/dd_comN_stack.dat
