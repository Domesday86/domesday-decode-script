# shellcheck shell=bash
#
# Domesday National B: what build-pack.sh needs to know about the side
# beyond its set table, which it reads from decode-national-b.sh so that
# there is still one list of the captures it is built from.

# The script whose SETS table lists the captures.
DISC_SCRIPT=decode-national-b.sh

# The side's name as the pack report gives it. Not stamped.
DISC_TITLE="Domesday National B"

# Where the side's outputs go, under $DD_DECODES/decode-script/.
DISC_OUT=national-b

# The stem vp415e loads the side by: <stem>.mkv. With no EFM there is no
# <stem>.dat or <stem>.dat.bsm.
STEM=dd_national_b

# The side carries no EFM: it is the CLV side of the National disc, an hour
# of video, and decode-national-b.sh decodes it with --noEFM. So the set
# stage measures quality alone, selection.yaml has no vfs stack, there is no
# vfs stage, and the pack is <stem>.mkv alone.
DISC_EFM=no

# The video sink's decoder: transform3d on every frame. The side is motion
# throughout, where the 3D filter separates best (docs/emulator-pack-plan.md,
# phase 5, has the per-side table this follows).
VIDEO_DECODER=transform3d
VIDEO_DECODER_SCHEDULE=

# The ld-decode settings every set is decoded with. They are part of each
# decode's stamp, so changing one marks every decode stale.
DECODE_LEAD_IN=1
DECODE_FRAMES=all

# How build-pack.sh runs the decodes: two at a time, four ld-decode workers
# each, the measured best (docs/performance.md). Speed only; not stamped.
DECODE_JOBS=2
DECODE_THREADS=4

# How build-pack.sh runs the set stage: SET_JOBS sets at a time. Reading the
# decode over the share is what bounds it, not the CPU. Over the 10G link the
# share gives one reader about 300 MB/s and three about 380 MB/s together, so
# three sets at a time come closest to that. Speed only; not stamped.
SET_JOBS=3

# What the side's disc metadata must say (the video stage's checks): its
# format and side, and the programme's addresses, every one of which must
# resolve to one frame of the mkv. On CLV an address is the timecode counted
# in frames (25 a second): the hand-built stack's address map runs from
# 0:00:00.01 for 89924 frames, and its metadata reads CLV side 1.
DISC_FORMAT=CLV
DISC_SIDE=1
DISC_PICTURES=1-89924

# The hand-built stack the video stage's result is compared with, relative
# to the decodes share. Read only; empty for none. It stacked DS4, DS8, DS10
# and DS6 (Mean), 89926 frames. Its metadata reads user code 1987 and
# Amendment 2 present, with status agreement 1.0, and 8 chapter transitions.
VIDEO_BASELINE=vp415e_projects/NationalB_output/dd_natB_stack.mkv
