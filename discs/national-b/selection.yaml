# National B: which sets go into the video stack, decided from the compare
# stage's report (orc-<rev>/compare/report.txt) as described in
# docs/emulator-pack-plan.md, phase 4. The video lists its sets the
# suggested reference first (it sets the stacker's sample grid), then by
# what each adds. Every mapped set the stack leaves out goes under dropped,
# with a reason. The side has no EFM (DISC_EFM=no), so there is no VFS stack.
#
# The evidence (orc-a7ec003, 2026-11-02): one version of the disc. Every
# set's Disc Mapper reads the same disc identity over the whole side (CLV
# side 1, 12 inch, user code 1987, CX off, Amendment 2 present, sound mono,
# though the sound is analogue stereo). Source Alignment finds four stamper
# groups, which are shared noise, not content: A = DS1 DS2 DS7 DS10 DS12,
# B = DS3 DS9, C = DS4 DS5 DS6 DS8, D = DS11. None is soft (5-6 MHz
# response 0.97-1.06). Its noise model is trusted, and predicts σ 5.65 for
# the Weighted stack of all twelve, against 11.63 for the best single set.

pressing: A    # the content version: every set is one

video:
  # DS10 first: the compare report's suggested reference (it sets the
  # stacker's sample grid), with 104 padding frames; the next choice is DS2
  # (161). The rest by what each adds, the predicted stack σ without it
  # (Source Alignment, a7ec003, over all twelve): DS11 6.40, DS3 5.78, DS9
  # 5.73, DS5, DS12, DS2, DS4, DS8 and DS1 5.67, DS6 5.66. DS11, alone in
  # its stamper group, adds the most. The captures that stop short of the
  # side's end: DS3 covers output frames 2-87297 and DS9 1-88995 of
  # 1-89926. DS9 has one gap in its picture numbering too wide to pad (234
  # pictures where the capture allows for 100).
  sets: [DS10, DS11, DS3, DS9, DS5, DS12, DS2, DS4, DS8, DS1, DS6]
  dropped:
    - set: DS7
      reason: >-
        its capture holds the programme to picture 65574 (43:42.24), then
        scans forward to 47:11 in steps of about 70 pictures, and the Disc
        Mapper places those scan frames as pictures up to output frame
        70210, about 4600 of them among padding, so the stack would take
        one mid-scan frame for each. It adds little (σ 5.67 without it,
        against 5.65), and has 4 gaps in its picture numbering too wide to
        pad.
