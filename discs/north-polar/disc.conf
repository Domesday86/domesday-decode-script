# shellcheck shell=bash
#
# North Polar: what build-pack.sh needs to know about the disc beyond its set
# table, which it reads from decode-north-polar.sh so that there is still one
# list of the captures it is built from.

# The script whose SETS table lists the captures.
DISC_SCRIPT=decode-north-polar.sh

# The disc's name as the pack report gives it. Not stamped.
DISC_TITLE="North Polar Expedition"

# Where the disc's outputs go, under $DD_DECODES/decode-script/.
DISC_OUT=north-polar

# The stem vp415e loads the disc by: <stem>.mkv. With no EFM there is no
# <stem>.dat or <stem>.dat.bsm.
STEM=north_polar

# The disc carries no EFM: its sound is analogue only (the frame-sync probes
# in the README), and decode-north-polar.sh decodes it with --noEFM. So the
# set stage measures quality alone, selection.yaml has no vfs stack, there is
# no vfs stage, and the pack is <stem>.mkv alone, which vp415e plays with
# SCSI reporting NOT READY.
DISC_EFM=no

# The video sink's decoder: transform3d on every frame. The disc is mostly
# motion, which is where the 3D filter separates best (the phase 5 table in
# docs/emulator-pack-plan.md).
VIDEO_DECODER=transform3d
VIDEO_DECODER_SCHEDULE=

# The ld-decode settings every set is decoded with. They are part of each
# decode's stamp, so changing one marks every decode stale.
DECODE_LEAD_IN=1
DECODE_FRAMES=all

# How build-pack.sh runs the decodes: two at a time, four ld-decode workers
# each, the measured best (docs/performance.md). Speed only; not stamped.
DECODE_JOBS=2
DECODE_THREADS=4

# How build-pack.sh runs the set stage: SET_JOBS sets at a time. Reading the
# decode over the share is what bounds it, not the CPU. Over the 10G link the
# share gives one reader about 300 MB/s and three about 380 MB/s together, so
# three sets at a time come closest to that. Speed only; not stamped.
SET_JOBS=3

# What the disc metadata must say (the video stage's checks): its format and
# side, and the programme's pictures, every one of which must resolve to one
# frame of the mkv. The disc's VBI reads side 1 on both captures (12 inch,
# Amendment 2 present, sound mode bilingual), as the library names them.
# DS2's capture runs to picture 54348, past the 54000 a CAV side usually
# holds, and DS1's stops on picture 51438 (probes of both captures' ends),
# so DS2 alone covers the last 2910 pictures.
DISC_FORMAT=CAV
DISC_SIDE=1
DISC_PICTURES=1-54348

# Neither capture reaches the lead-out: both are still reading pictures on
# their last frame. So the mkv has a lead-in and no lead-out, and the video
# stage's check wants just that.
DISC_LEAD_OUT=absent

# The hand-built stack the video stage's result is compared with, relative
# to the decodes share. Read only; empty for none. North Polar has none.
VIDEO_BASELINE=
