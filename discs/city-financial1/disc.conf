# shellcheck shell=bash
#
# City Financial 1: what build-pack.sh needs to know about the disc beyond its
# set table, which it reads from decode-city-financial1.sh so that there is
# still one list of the captures it is built from.

# The script whose SETS table lists the captures.
DISC_SCRIPT=decode-city-financial1.sh

# The side's name as the pack report gives it. Not stamped.
DISC_TITLE="City Financial 1"

# Where the side's outputs go, under $DD_DECODES/decode-script/.
DISC_OUT=city-financial1

# The stem vp415e loads the side by: <stem>.mkv, <stem>.dat, <stem>.dat.bsm.
STEM=city_financial1

# The video sink's decoder (decoder_type multiple, with this schedule):
# palstill, the PAL Still decoder made for single-frame stills, on every frame
# but those the Stacker finds held, which held:transform3d gives the 3D filter,
# as the decode-orc guide (Decoding the Domesday discs) has it for a
# still-frame side. The City discs' content is mostly stills (the phase 5 table
# in docs/emulator-pack-plan.md), and no motion range is known yet; one would
# be given transform3d here.
VIDEO_DECODER=multiple
VIDEO_DECODER_SCHEDULE="palstill, held:transform3d"

# The ld-decode settings every set is decoded with. They are part of each
# decode's stamp, so changing one marks every decode stale.
DECODE_LEAD_IN=1
DECODE_FRAMES=all

# How build-pack.sh runs the decodes: two at a time, four ld-decode workers
# each, the measured best (docs/performance.md). Speed only; not stamped.
DECODE_JOBS=2
DECODE_THREADS=4

# How build-pack.sh runs the set stage: SET_JOBS sets at a time. Reading the
# decode over the share is what bounds it, not the CPU. Over the 10G link the
# share gives one reader about 300 MB/s and three about 380 MB/s together, so
# three sets at a time come closest to that. Speed only; not stamped.
SET_JOBS=3

# What the side's disc metadata must say (the video stage's checks): its
# format and side, and the programme's pictures, every one of which must
# resolve to one frame of the mkv. The disc's VBI reads side 1 (user code
# 1993); Culture 2, also single-sided, reads side 2.
DISC_FORMAT=CAV
DISC_SIDE=1
DISC_PICTURES=1-53981

# The hand-built stack the video stage's result is compared with, relative
# to the decodes share. Read only; empty for none. The City discs have none.
VIDEO_BASELINE=

# The hand-built VFS image the vfs stage's result is compared with (its .bsm
# beside it), relative to the decodes share. Read only; empty for none.
# The City discs have none.
VFS_BASELINE=
